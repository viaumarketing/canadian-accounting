name: Release images
on:
  push:
    tags: ['v*']
permissions: { contents: read, packages: write }
env:
  # The DXP2800 (Intel N100) is x86-64. Add linux/arm64 only if you also run an ARM host: building it under QEMU emulation is slow.
  PLATFORMS: linux/amd64
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/check-migrations.mjs # rollback safety: see docs/dxp2800.md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=moderate

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: { target: [server, web, backup] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: ${{ env.PLATFORMS != 'linux/amd64' }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag must be vX.Y.Z (got $GITHUB_REF_NAME)"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase repository path
          echo "repo=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          # Exact version (what .env pins) and X.Y (latest patch of a minor). No floating `latest`: upgrades are deliberate.
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.target }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.target }}:${{ steps.meta.outputs.minor }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
